<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Welcome to the Founding Circle | Kingsway Spirit</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>:root{--text:#f6f1e7;--gold:#c8a96a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,rgba(200,169,106,.16),transparent 38%),linear-gradient(180deg,#121212,#050505);color:var(--text);font-family:Inter,sans-serif;padding:24px}.card{width:min(680px,100%);text-align:center;border:1px solid rgba(200,169,106,.24);border-radius:34px;background:rgba(255,255,255,.035);padding:42px 34px;box-shadow:0 30px 100px rgba(0,0,0,.45)}img{height:92px;width:auto;margin:0 auto 24px;filter:drop-shadow(0 0 18px rgba(200,169,106,.25))}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.42em;font-size:12px;margin-bottom:16px;font-weight:600}h1{font-family:'Playfair Display',serif;font-size:clamp(34px,5vw,54px);line-height:1.1;margin:0}p{margin:20px auto 0;color:rgba(246,241,231,.74);max-width:520px;line-height:1.8}a{display:inline-block;margin-top:30px;padding:14px 24px;border-radius:999px;background:linear-gradient(135deg,#c8a96a,#ead6a5);color:#000;text-decoration:none;text-transform:uppercase;letter-spacing:.22em;font-size:12px;font-weight:800}</style></head><body><div class="card"><img src="../logo.png" alt="Kingsway Spirit Logo"><div class="eyebrow">Founding Circle</div><h1>Welcome to the Founding Circle.</h1><p>Thank you for joining Kingsway Spirit. We look forward to sharing our journey as we bring exceptional European craft spirits to India.</p><a href="/">Return to Website</a></div></body></html>
